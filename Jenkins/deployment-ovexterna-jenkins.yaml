apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovexterna
  labels:
    app: react-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
      - name: react-app
        image: coopmorteros/ovexterna
        ports:
        - containerPort: 8082
