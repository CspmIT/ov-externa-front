apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovexterna-deployment
  labels:
    app: react-app-ov
spec:
  replicas: 3
  selector:
    matchLabels:
      app: react-app-ov
  template:
    metadata:
      labels:
        app: react-app-ov
    spec:
      containers:
      - name: react-app-ov
        image: coopmorteros/ovexterna
        ports:
        - containerPort: 8082
