apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ovexterna-ingress
spec:
  rules:
  - host: "ovexterna.coopmorteros" # Reemplaza esto con tu dirección IP
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: ovexterna-service
            port:
              number: 8082
